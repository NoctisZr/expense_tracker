name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v6

      - name: Configurar Java (requerido por Gradle/Android)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter (canal estable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar el andamiaje nativo de Android (plantilla de referencia)
        run: |
          flutter create --platforms=android --org com.noctis.expensetracker --project-name expense_tracker /tmp/scaffold

      - name: Generar la configuración de la app (versión, repositorio, reportes)
        env:
          REPO: ${{ github.repository }}
          FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
          FEEDBACK_APP_KEY: ${{ vars.FEEDBACK_APP_KEY }}
        run: python3 tool/gen_app_config.py

      - name: Analizar el código (informativo, no bloquea el build)
        run: flutter analyze || true

      - name: Pruebas unitarias (informativo, no bloquea el build)
        run: flutter test || true

      - name: Compilar el APK (patch de Android, firma y planes de respaldo)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash tool/ci_build.sh

      - name: Mostrar tamaños y con qué certificado quedó firmado el APK
        run: |
          APK_DIR=build/app/outputs/flutter-apk
          {
            echo "### Tamaño de los APK"
            echo '```'
            ls -lh "$APK_DIR"/*-release.apk | awk '{print $5, $9}'
            echo '```'
            echo "Instala **app-arm64-v8a-release.apk** (casi todos los teléfonos desde ~2016). El de armeabi-v7a es solo para teléfonos muy antiguos de 32 bits."
          } >> "$GITHUB_STEP_SUMMARY"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner no encontrado; se omite la verificación."
            exit 0
          fi
          APK=$(ls "$APK_DIR"/*arm64-v8a-release.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then APK=$(ls "$APK_DIR"/*.apk | head -n 1); fi
          OUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          echo "$OUT"
          {
            echo "### Certificado del APK (modo: ${BUILD_MODE:-?})"
            echo '```'
            echo "$OUT" | grep -i "certificate" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$OUT" | grep -qi "Android Debug"; then
            if [ "$SIGNED" = "true" ]; then
              echo "::warning::Hay secretos de firma pero el APK sigue firmado con la clave de depuración. Revisa SIGNING.md."
            else
              echo "::warning::APK firmado con la clave de depuración (sin firma estable)."
            fi
          fi

      - name: Preparar el release (etiqueta, notas del CHANGELOG, APK renombrados)
        id: meta
        run: python3 tool/release_notes.py

      # Cada APK sale como un artifact SEPARADO (descargas solo el que necesitas).
      - name: Subir el APK arm64-v8a (casi todos los teléfonos)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.version }}-arm64-v8a
          path: dist/*-arm64-v8a.apk
          if-no-files-found: error

      - name: Subir el APK armeabi-v7a (teléfonos antiguos de 32 bits)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.version }}-armeabi-v7a
          path: dist/*-armeabi-v7a.apk
          if-no-files-found: warn

      - name: Publicar el release en GitHub (descargable y marcado como el último)
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release_notes.md
          files: dist/*.apk
          draft: false
          prerelease: false
          make_latest: true

      - name: Avisar en Telegram (canal de novedades, si está configurado)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          APP: ${{ steps.meta.outputs.app }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
        run: |
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHANNEL:-}" ]; then
            echo "Sin secretos de Telegram: no se envía el aviso."
            exit 0
          fi
          NOTES=$(sed -n '3,/^---$/p' release_notes.md | grep -v '^---$' | head -c 700)
          TEXT=$(printf '🆕 %s %s (build %s)\n\n%s\n\n⬇️ Descargar: %s' "$APP" "$VERSION" "$BUILD" "$NOTES" "$RELEASE_URL")
          curl -s -o /dev/null -w "Telegram HTTP %{http_code}\n" -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHANNEL}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" || true
